name: Build and deploy Pages
on:
  push:
    branches: [main, dev]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Main source
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          path: main-source
      - name: Dev source
        uses: actions/checkout@v7.0.1
        with:
          ref: dev
          path: dev-source
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Build and test main
        working-directory: main-source
        env:
          GITHUB_PAGES_BASE: /PROF.STAFF/
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm test
          npm run build
      - name: Build and test dev
        working-directory: dev-source
        env:
          GITHUB_PAGES_BASE: /PROF.STAFF/dev/
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm test
          npm run build
      - name: Prepare site
        run: |
          mkdir -p site/dev
          cp -a main-source/dist/. site/
          cp -a dev-source/dist/. site/dev/
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5.0.1
